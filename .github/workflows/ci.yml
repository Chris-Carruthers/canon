name: CI

on:
  # EVERY branch, not just main. Feature branches used to be covered only by the
  # pull_request event — and when GitHub missed the `synchronize` for a push, the
  # PR went on displaying the previous commit's four green checks while the code
  # that would actually merge had never been tested. A false green is worse than a
  # missing one, because nobody investigates it. This costs a duplicate run on PR
  # branches; the suite is under a minute, and that is a fair price for "no checks"
  # meaning "no commit" rather than "no event".
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS ships bash 3.2, Linux ships 5.x. The kit must work on both, and
        # the 3.2 leg is the one that catches accidental bash-4-isms.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Versions
        run: |
          bash --version | head -1
          git --version
          python3 --version

      - name: Test suite
        run: ./test/run.sh

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint
        run: |
          # SC1091: can't follow non-constant source paths (by design here).
          # SC2016: single quotes in heredocs are intentional (python payloads).
          shellcheck --shell=bash --severity=warning --exclude=SC1091,SC2016 \
            install.sh \
            bin/canon-* \
            templates/repo/.claude/hooks/*.sh \
            test/run.sh

  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Executables are executable
        run: |
          fail=0
          for f in install.sh bin/canon-* test/run.sh \
                   templates/repo/.claude/hooks/*.sh; do
            [ -x "$f" ] || { echo "not executable: $f"; fail=1; }
          done
          exit $fail

      - name: Connectors parse
        run: |
          node --check connectors/shared/vault.mjs
          node --check connectors/shared/agent.mjs
          node --check connectors/slack/src/app.mjs
          node --check connectors/discord/src/app.mjs
          node --check connectors/mcp/src/server.mjs

      - name: MCP path-traversal boundary
        run: node test/paths.test.mjs

      - name: Versions agree with VERSION
        run: |
          want="$(cat VERSION)"
          fail=0
          for f in bin/canon-* ./install.sh; do
            got="$("$f" --version | awk '{print $2}')"
            [ "$got" = "$want" ] || { echo "$f reports $got, VERSION says $want"; fail=1; }
          done
          # Everything else that declares a version. This loop used to cover the
          # shell entry points only, and two of the four below had already drifted
          # to 0.1.0 while the rest of the kit moved on.
          for f in .claude-plugin/plugin.json connectors/mcpb/manifest.json \
                   connectors/mcp/package.json connectors/slack/package.json \
                   connectors/discord/package.json; do
            got="$(python3 -c "import json,sys;print(json.load(open(sys.argv[1])).get('version'))" "$f")"
            [ "$got" = "$want" ] || { echo "$f reports $got, VERSION says $want"; fail=1; }
          done
          # The MCP server advertises its own version over the protocol, so a
          # client sees this string rather than package.json. It was hardcoded.
          got="$(sed -n 's/.*name: "canon", version: "\([^"]*\)".*/\1/p' connectors/mcp/src/server.mjs)"
          [ "$got" = "$want" ] || { echo "mcp server advertises $got, VERSION says $want"; fail=1; }
          exit $fail

      - name: README test badge matches reality
        run: |
          actual="$(./test/run.sh | tail -1 | sed 's/\x1b\[[0-9;]*m//g' | grep -oE '^[0-9]+')"
          badge="$(sed -n 's/.*tests-\([0-9]*\)%20passing.*/\1/p' README.md)"
          [ "$actual" = "$badge" ] || {
            echo "README badge says $badge tests, suite runs $actual"; exit 1; }
          echo "badge matches: $actual"

      - name: Markdown links and anchors resolve
        run: node test/links.test.mjs

      - name: No references to deleted modules
        run: |
          if grep -rn "shared/core\.mjs" --include='*.md' --include='*.mjs' \
               --include='*.yml' --exclude-dir=.git . ; then
            echo "reference to a module that no longer exists"; exit 1
          fi
          echo "no stale module references"

      - name: No absolute local paths leaked
        run: |
          if grep -rn "/Users/\|/home/[a-z]" --include='*' \
               --exclude-dir=.git --exclude-dir=.github . ; then
            echo "absolute local paths found"; exit 1
          fi
